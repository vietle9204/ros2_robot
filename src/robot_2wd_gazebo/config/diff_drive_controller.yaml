controller_manager:
  ros__parameters:
    update_rate: 50
    use_sim_time: true

diff_drive_controller:
  ros__parameters:
    left_wheel_names: ["left_wheel_joint"]
    right_wheel_names: ["right_wheel_joint"]
    wheel_separation: 0.4
    wheel_radius: 0.05
    publish_rate: 50
    command_interfaces: ["velocity"]
    state_interfaces: ["position", "velocity"]

joint_state_broadcaster:
  ros__parameters: {}

